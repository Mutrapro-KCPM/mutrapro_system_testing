name: API CI with Newman

on:
  push:
    branches:
      - main
      - dev
      - "feature/**"
      - "bugfix/**"
      - "test/**"
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read
  checks: write

env:
  COMPOSE_PROJECT_NAME: mutrapro_system_testing_ci
  DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
  JWT_SECRET: ${{ secrets.JWT_SECRET }}
  CORS_ORIGIN: "http://localhost:3000"
  RABBITMQ_DEFAULT_USER: "user"
  RABBITMQ_DEFAULT_PASS: ${{ secrets.RABBITMQ_DEFAULT_PASS }}
  NIFI_SENSITIVE_PROPS_KEY: ${{ secrets.NIFI_SENSITIVE_PROPS_KEY }}
  INTERNAL_SERVICE_TOKEN: ${{ secrets.INTERNAL_SERVICE_TOKEN }}

jobs:
  api-newman:
    name: Docker Compose API + Newman
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required CI secrets
        shell: bash
        run: |
          set -e
          missing=()
          for name in DB_PASSWORD JWT_SECRET RABBITMQ_DEFAULT_PASS NIFI_SENSITIVE_PROPS_KEY INTERNAL_SERVICE_TOKEN; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing required GitHub Secrets: ${missing[*]}"
            exit 1
          fi

      - name: Validate Docker Compose
        run: docker compose config

      - name: Build API stack
        run: |
          set -e
          for i in 1 2 3; do
            if docker compose build api-gateway; then
              exit 0
            fi
            echo "Docker compose build failed; retrying ($i/3)..."
            sleep 15
          done
          docker compose build api-gateway

      - name: Start API stack
        run: docker compose up -d api-gateway

      - name: Show container status
        run: docker compose ps

      - name: Wait for API Gateway health
        run: |
          set -e
          for i in {1..30}; do
            if curl -fsS http://localhost:3007/api/health; then
              echo "API Gateway is healthy"
              exit 0
            fi
            echo "Waiting for API Gateway health... attempt $i/30"
            docker compose ps
            sleep 10
          done
          echo "API Gateway did not become healthy in time"
          docker compose logs --tail=200 api-gateway || true
          docker compose logs --tail=200 auth-service || true
          docker compose logs --tail=200 mysql_db || true
          exit 1

      - name: Install Newman
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-factor 2
          npm config set fetch-retry-mintimeout 10000
          npm config set fetch-retry-maxtimeout 120000
          npm install -g newman newman-reporter-htmlextra

      - name: Run Postman collection with Newman
        run: |
          mkdir -p newman-results
          test -f tests/fixtures/upload-test.mp3
          newman run "postman/Presentation.postman_collection.json" \
            --environment "postman/MutraPro Local.postman_environment.json" \
            --env-var "baseUrl=http://localhost:3007/api" \
            --working-dir "." \
            --reporters cli,junit,json,htmlextra \
            --reporter-junit-export newman-results/newman-report.xml \
            --reporter-json-export newman-results/newman-report.json \
            --reporter-htmlextra-export newman-results/newman-report.html

      - name: Upload Newman reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-results
          path: newman-results/
          if-no-files-found: ignore

      - name: Publish Newman test annotations
        if: always() && hashFiles('newman-results/newman-report.xml') != ''
        uses: dorny/test-reporter@v1
        with:
          name: Newman API Tests
          path: newman-results/newman-report.xml
          reporter: java-junit

      - name: Print failure logs
        if: failure()
        run: |
          docker compose ps || true
          docker compose logs --tail=200 api-gateway || true
          docker compose logs --tail=200 auth-service || true
          docker compose logs --tail=200 mysql_db || true

      - name: Stop containers
        if: always()
        run: docker compose down --remove-orphans -v

      - name: Extract Jira issue key
        if: always()
        id: jira
        shell: bash
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          ISSUE_KEY=$(printf '%s\n' "$PR_TITLE" "$BRANCH_NAME" "$COMMIT_MESSAGE" | grep -oE '[A-Z][A-Z0-9]+-[0-9]+' | head -n 1 || true)
          echo "issue_key=$ISSUE_KEY" >> "$GITHUB_OUTPUT"
          if [ -n "$ISSUE_KEY" ]; then
            echo "Detected Jira issue key: $ISSUE_KEY"
          else
            echo "No Jira issue key found in PR title, branch name, or commit message."
          fi

      - name: Check Jira credentials
        if: always()
        id: jira_credentials
        shell: bash
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          if [ -n "$JIRA_BASE_URL" ] && [ -n "$JIRA_EMAIL" ] && [ -n "$JIRA_API_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Jira secrets are not fully configured; Jira feedback will be skipped."
          fi

      - name: Comment Jira when CI passed
        if: success() && steps.jira.outputs.issue_key != '' && steps.jira_credentials.outputs.available == 'true'
        continue-on-error: true
        shell: bash
        env:
          ISSUE_KEY: ${{ steps.jira.outputs.issue_key }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          BODY_TEXT="CI PASSED: GitHub Actions completed Newman API tests successfully. Branch: ${BRANCH_NAME}. Commit: ${GITHUB_SHA}. Run: ${RUN_URL}"
          jq -n --arg text "$BODY_TEXT" \
            '{body:{type:"doc",version:1,content:[{type:"paragraph",content:[{type:"text",text:$text}]}]}}' \
            > jira-comment.json
          curl --fail --silent --show-error --request POST \
            --url "${JIRA_BASE_URL}/rest/api/3/issue/${ISSUE_KEY}/comment" \
            --user "${JIRA_EMAIL}:${JIRA_API_TOKEN}" \
            --header "Accept: application/json" \
            --header "Content-Type: application/json" \
            --data @jira-comment.json

      - name: Comment Jira when CI failed
        if: failure() && steps.jira.outputs.issue_key != '' && steps.jira_credentials.outputs.available == 'true'
        continue-on-error: true
        shell: bash
        env:
          ISSUE_KEY: ${{ steps.jira.outputs.issue_key }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          BODY_TEXT="CI FAILED: GitHub Actions found a problem while running Newman API tests. Open the run logs, fix the code/test/environment, then push again. Branch: ${BRANCH_NAME}. Commit: ${GITHUB_SHA}. Run: ${RUN_URL}"
          jq -n --arg text "$BODY_TEXT" \
            '{body:{type:"doc",version:1,content:[{type:"paragraph",content:[{type:"text",text:$text}]}]}}' \
            > jira-comment.json
          curl --fail --silent --show-error --request POST \
            --url "${JIRA_BASE_URL}/rest/api/3/issue/${ISSUE_KEY}/comment" \
            --user "${JIRA_EMAIL}:${JIRA_API_TOKEN}" \
            --header "Accept: application/json" \
            --header "Content-Type: application/json" \
            --data @jira-comment.json
