services:
  # Dịch vụ Cơ sở dữ liệu MySQL
  mysql_db:
    build:
      context: .
      dockerfile: ./services/mysql_db/Dockerfile
    restart: always
    mem_limit: 1G
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_APP_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci 
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h localhost -uroot --silent || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - mutrapro-network

  # === KHỐI REDIS CACHE ĐÃ ĐƯỢC THÊM VÀO ĐÚNG VỊ TRÍ ===
  redis_cache:
    image: redis:6-alpine
    restart: always
    networks:
      - mutrapro-network
  # === KẾT THÚC KHỐI THÊM MỚI ===

  # === THÊM SERVICE RABBITMQ MỚI DƯỚI ĐÂY ===
  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    networks:
      - mutrapro-network
  # === KẾT THÚC PHẦN THÊM MỚI ===

  # ================== START: THÊM MỚI NIFI ==================
  nifi:
    build:
      context: .
      dockerfile: ./services/nifi/Dockerfile
    restart: always
    mem_limit: 1G
    ports:
      # Ní sẽ truy cập giao diện NiFi qua cổng động
      - "${NIFI_PORT:-9090}:8080"
    environment:
      - NIFI_WEB_HTTP_PORT=8080
      # Một key bí mật, ní có thể đổi thành gì cũng được
      - NIFI_SENSITIVE_PROPS_KEY=${NIFI_SENSITIVE_PROPS_KEY}
    volumes:
      # Volumes để NiFi lưu trữ flow
      - nifi_data:/opt/nifi/nifi-current/database_repository
      - nifi_conf:/opt/nifi/nifi-current/conf
    depends_on:
      - mysql_db # Đảm bảo NiFi khởi động sau CSDL
    networks:
      - mutrapro-network
  # ================== END: THÊM MỚI NIFI ==================
  
  # --- CÁC SERVICE BACKEND ĐÃ ĐƯỢC SỬA LẠI PHẦN BUILD ---
  auth-service:
    build:
      context: .
      dockerfile: ./services/auth-service/Dockerfile
    restart: always
    environment:
      - DB_HOST=mysql_db
      - DB_USER=mutrapro_app
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_AUTH_NAME=mutrapro_auth
      - JWT_SECRET=${JWT_SECRET}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - SERVICE_NAME=auth-service
    volumes:
      - ./logs/auth-service:/app/logs
    depends_on:
      mysql_db:
        condition: service_healthy
      redis_cache:
        condition: service_started
    networks:
      - mutrapro-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  order-service:
    build:
      context: .
      dockerfile: ./services/order-service/Dockerfile
    restart: always
    environment:
      - DB_HOST=mysql_db
      - DB_USER=mutrapro_app
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_ORDER_NAME=mutrapro_order
      - JWT_SECRET=${JWT_SECRET}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - SERVICE_NAME=order-service
    volumes:
      - ./logs/order-service:/app/logs
    depends_on:
      mysql_db:
        condition: service_healthy
    networks:
      - mutrapro-network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3

  task-service:
    build:
      context: .
      dockerfile: ./services/task-service/Dockerfile
    restart: always
    environment:
      - DB_HOST=mysql_db
      - DB_USER=mutrapro_app
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_TASK_NAME=mutrapro_task
      - JWT_SECRET=${JWT_SECRET}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - SERVICE_NAME=task-service
    volumes:
      - ./logs/task-service:/app/logs
    depends_on:
      mysql_db:
        condition: service_healthy
    networks:
      - mutrapro-network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3

  file-service:
    build:
      context: .
      dockerfile: ./services/file-service/Dockerfile
    restart: always
    environment:
      - DB_HOST=mysql_db
      - DB_USER=mutrapro_app
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_FILE_NAME=mutrapro_file
      - JWT_SECRET=${JWT_SECRET}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - SERVICE_NAME=file-service
    volumes:
      - ./uploads:/app/uploads
      - ./logs/file-service:/app/logs
    depends_on:
      mysql_db:
        condition: service_healthy
    networks:
      - mutrapro-network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3004/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3

  studio-service:
    build:
      context: .
      dockerfile: ./services/studio-service/Dockerfile
    restart: always
    environment:
      - DB_HOST=mysql_db
      - DB_USER=mutrapro_app
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_STUDIO_NAME=mutrapro_studio
      - JWT_SECRET=${JWT_SECRET}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - SERVICE_NAME=studio-service
    volumes:
      - ./logs/studio-service:/app/logs
    depends_on:
      mysql_db:
        condition: service_healthy
    networks:
      - mutrapro-network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3005/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3

  notification-service:
    build:
      context: .
      dockerfile: ./services/notification-service/Dockerfile
    ports:
      - "${NOTIFY_PORT:-3006}:3006"
    restart: always
    environment:
      - DB_HOST=mysql_db
      - DB_USER=mutrapro_app
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - DB_NOTIFICATION_NAME=mutrapro_notification
      - SERVICE_NAME=notification-service
    volumes:
      - ./logs/notification-service:/app/logs
    depends_on:
      mysql_db:
        condition: service_healthy
    networks:
      - mutrapro-network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3006/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3

# ================== START: THÊM MỚI ANALYTICS-SERVICE ==================
  analytics-service:
    build:
      context: .
      dockerfile: ./services/analytics-service/Dockerfile
    restart: always
    environment:
      - DB_HOST=mysql_db
      - DB_USER=mutrapro_app
      - DB_PASSWORD=${DB_PASSWORD}
      # Nó sẽ kết nối vào CSDL báo cáo MỚI
      - DB_ANALYTICS_NAME=mutrapro_analytics
      - JWT_SECRET=${JWT_SECRET}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - SERVICE_NAME=analytics-service
    volumes:
      - ./logs/analytics-service:/app/logs
    depends_on:
      mysql_db:
        condition: service_healthy
    networks:
      - mutrapro-network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3008/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
  # ================== END: THÊM MỚI ANALYTICS-SERVICE ==================

  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    restart: always
    ports:
      - "${API_PORT:-3007}:3007"
    environment:
      - CORS_ORIGIN=${CORS_ORIGIN}
    depends_on:
      auth-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      task-service:
        condition: service_healthy
      file-service:
        condition: service_healthy
      studio-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      analytics-service:
        condition: service_healthy
    networks:
      - mutrapro-network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3007/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ================== START: THÊM MỚI SONARQUBE ==================
  sonarqube:
    image: sonarqube:lts-community
    container_name: mutrapro_system_testing-sonarqube-1
    restart: always
    ports:
      - "${SONAR_PORT:-9000}:9000"
    networks:
      - mutrapro-network
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
  # ================== END: THÊM MỚI SONARQUBE ====================
  
  # Ứng dụng web cho người dùng (giữ nguyên)
  web-app:
    build: ./web-app
    restart: always
    ports:
      - "${WEB_PORT:-3000}:80" # Đã sửa port cho đúng với Nginx
    environment:
      - REACT_APP_API_GATEWAY_URL=http://api-gateway:3007
    networks:
      - mutrapro-network

# Định nghĩa network chung
networks:
  mutrapro-network:
    driver: bridge

# Định nghĩa volumes
volumes:
  mysql_data:
    driver: local
  uploads:
    driver: local
  nifi_data:
    driver: local
  nifi_conf:
    driver: local
  sonarqube_data:
    driver: local
  sonarqube_extensions:
    driver: local
  sonarqube_logs:
    driver: local
