version: '3.8'

services:
  jenkins:
    build: .
    image: mutrapro-jenkins:lts
    network_mode: bridge
    container_name: jenkins
    user: root
    restart: unless-stopped

    ports:
      - "8080:8080"
      - "50000:50000"

    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

    environment:
      - TZ=Asia/Ho_Chi_Minh

volumes:
  jenkins_home:
